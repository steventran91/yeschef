services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: yeschef
      POSTGRES_USER: yeschef
      POSTGRES_PASSWORD: yeschef
    ports:
      - "5433:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://yeschef:yeschef@db:5432/yeschef
    ports:
    - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
